# -------------------------------------------------------------------
# TimeSense 自动构建 / 发布流水线
#
# 触发：打 v* 标签，或在 GitHub 网页 Actions 里手动运行
# 产物：Windows x64 + Windows ARM64 两个 NSIS 安装包，挂到 GitHub Release
#
# 说明：本文件是「一次性配置」，日常改业务代码不用动它。
#       发版时只要把 src-tauri/tauri.conf.json 的 version 改掉
#       （并保证 tag 与 version 一致，例如都是 v0.2.0）即可。
# -------------------------------------------------------------------
name: Build Release

on:
  push:
    tags:
      - 'v*'            # 例：git tag v0.2.0 && git push github v0.2.0
  workflow_dispatch:     # 也可在 Actions 页面手动点「Run workflow」

# tauri-action 需要创建/更新 Release，故授予写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # 一个架构失败不影响另一个，便于对照排查
      matrix:
        include:
          # Windows x64 —— 普通 64 位 Windows 用户
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows ARM64 —— Win11 on ARM 原生运行（由原生 ARM runner 构建）
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链（含目标架构）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ 会被自动替换为 tauri.conf.json 里的 version
          tagName: v__VERSION__
          releaseName: 'TimeSense v__VERSION__'
          releaseBody: '下载对应架构的安装包：x64 用于普通 Windows，arm64 用于 Windows on ARM。'
          releaseDraft: true   # 先出草稿，你确认后再手动发布（想全自动可改成 false）
          prerelease: false
          args: --target ${{ matrix.target }}
